name: Prepare 50.9 greeting name resolution

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prepare-50-9-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'fix/50-9-greeting-name-resolution' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Write 50.9 release metadata
        run: >-
          node -e "const fs=require('fs'); const r={version:'50.9',date:'7 October 2026',title:'Make personalised greetings automatic and safe',summary:'Uses the user-selected name when valid and automatically falls back to the imported roster identity.',changes:['Uses a valid name entered in Personalise first, then the imported roster name, then the approved account display name.','Rejects sentence-like or malformed personal-name values so phrases cannot appear in the Night greeting.','Applies the same automatic behaviour to existing staff and future users without hard-coding individual names.'],update_policy:'normal'}; fs.writeFileSync('release.json',JSON.stringify(r,null,2)+'\n');"
      - name: Synchronise release artifacts
        run: node scripts/release.mjs
      - name: Run fast product gate
        run: npm run verify:fast
      - name: Run full deterministic gate
        run: npm run verify:ci
      - name: Commit synchronised 50.9 artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "50.9 artifacts are already synchronised."
          else
            git commit -m "50.9 Make personalised greetings automatic and safe"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
