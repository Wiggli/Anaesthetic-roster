name: Prepare 56.2 four-nurse role release

on:
  push:
    branches: [fix/four-nurse-role-reassignment]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[four-role-prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/four-nurse-role-reassignment
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch four-nurse night-only roles
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch target: {label}')
              return text.replace(old, new, 1)

          clinical_path = Path('src/legacy-ui/clinical.js')
          text = clinical_path.read_text()

          old = "function roleAssignmentKeys(assignments){return assignments&&assignments.mode==='5'?FIVE_NIGHT_ROLE_KEYS:assignments&&assignments.mode==='7'?SEVEN_NIGHT_ROLE_KEYS:CORE_ALLOCATION_KEYS}\nvar FIVE_NIGHT_ROLE_KEYS=['first1','first2','second1','second2','fullLW'];\nvar SEVEN_NIGHT_ROLE_KEYS=['first1','first2','second1','second2','pager','reliever','seventh'];\nfunction validRoleAssignments(assignments){if(!assignments||typeof assignments!=='object'||Array.isArray(assignments))return false;var keys=roleAssignmentKeys(assignments),custom=assignments.mode==='5'||assignments.mode==='7',expected=(custom?keys.concat(['mode']):keys).slice().sort(),supplied=Object.keys(assignments).sort();if(expected.length!==supplied.length||expected.some(function(key,index){return supplied[index]!==key}))return false;var values=keys.map(function(key){return String(assignments[key]||'').trim()});return values.every(Boolean)&&new Set(values.map(function(name){return canonicalNurseName(name)})).size===keys.length}"
          new = "function roleAssignmentKeys(assignments){return assignments&&assignments.mode==='4'?FOUR_NIGHT_ROLE_KEYS:assignments&&assignments.mode==='5'?FIVE_NIGHT_ROLE_KEYS:assignments&&assignments.mode==='7'?SEVEN_NIGHT_ROLE_KEYS:CORE_ALLOCATION_KEYS}\nvar FOUR_NIGHT_ROLE_KEYS=['first1','first2','second1','second2'];\nvar FIVE_NIGHT_ROLE_KEYS=['first1','first2','second1','second2','fullLW'];\nvar SEVEN_NIGHT_ROLE_KEYS=['first1','first2','second1','second2','pager','reliever','seventh'];\nfunction validRoleAssignments(assignments){if(!assignments||typeof assignments!=='object'||Array.isArray(assignments))return false;var keys=roleAssignmentKeys(assignments),custom=assignments.mode==='4'||assignments.mode==='5'||assignments.mode==='7',expected=(custom?keys.concat(['mode']):keys).slice().sort(),supplied=Object.keys(assignments).sort();if(expected.length!==supplied.length||expected.some(function(key,index){return supplied[index]!==key}))return false;var values=keys.map(function(key){return String(assignments[key]||'').trim()});return values.every(Boolean)&&new Set(values.map(function(name){return canonicalNurseName(name)})).size===keys.length}"
          text = replace_once(text, old, new, 'role keys')

          old = "function validRoleAssignmentsForNight(base,assignments){if(!validRoleAssignments(assignments))return false;var working=nightWorkingNames(base),assigned;if(assignments.mode==='5'){assigned=FIVE_NIGHT_ROLE_KEYS.map(function(key){return assignments[key]});return working.length===5&&sameNightNameSet(working,assigned)}"
          new = "function validRoleAssignmentsForNight(base,assignments){if(!validRoleAssignments(assignments))return false;var working=nightWorkingNames(base),assigned;if(assignments.mode==='4'){assigned=FOUR_NIGHT_ROLE_KEYS.map(function(key){return assignments[key]});return working.length===4&&sameNightNameSet(working,assigned)}if(assignments.mode==='5'){assigned=FIVE_NIGHT_ROLE_KEYS.map(function(key){return assignments[key]});return working.length===5&&sameNightNameSet(working,assigned)}"
          text = replace_once(text, old, new, 'four mode validation')

          marker = "function suggestedFiveRoleAssignments(base){"
          insertion = "function suggestedFourRoleAssignments(base){var raw=rawBaseForDate(base.date),names=nightWorkingNames(base);if(names.length!==4)return null;var assignments={mode:'4'},used=[];FOUR_NIGHT_ROLE_KEYS.forEach(function(key){var rostered=raw[key];if(names.some(function(active){return canonicalNurseName(active)===canonicalNurseName(rostered)})&&!used.some(function(name){return canonicalNurseName(name)===canonicalNurseName(rostered)})){assignments[key]=rostered;used.push(rostered)}});FOUR_NIGHT_ROLE_KEYS.forEach(function(key){if(assignments[key])return;var next=names.find(function(name){return !used.some(function(saved){return canonicalNurseName(saved)===canonicalNurseName(name)})});assignments[key]=next;used.push(next)});return validRoleAssignmentsForNight(base,assignments)?assignments:null}\n"
          if insertion.strip() not in text:
              if marker not in text: raise SystemExit('missing suggestedFive marker')
              text = text.replace(marker, insertion + marker, 1)

          old = "function currentRoleAssignments(base){var stored=nightRoleOverrides[base.date],assignments=stored&&stored.assignments;if(validRoleAssignmentsForNight(base,assignments))return Object.assign({},assignments);var working=nightWorkingNames(base);if(working.length===5)return suggestedFiveRoleAssignments(base);"
          new = "function currentRoleAssignments(base){var stored=nightRoleOverrides[base.date],assignments=stored&&stored.assignments;if(validRoleAssignmentsForNight(base,assignments))return Object.assign({},assignments);var working=nightWorkingNames(base);if(working.length===4)return suggestedFourRoleAssignments(base);if(working.length===5)return suggestedFiveRoleAssignments(base);"
          text = replace_once(text, old, new, 'current four roles')

          old = "var working=nightWorkingNames(base);if(working.length<5)return{notice:'Custom roles are unavailable while cover is incomplete. Add enough cover to reach five nurses before arranging this night’s roles.'};"
          new = "var working=nightWorkingNames(base);if(working.length<4)return{notice:'Custom roles are unavailable while fewer than four nurses are working. Restore enough cover for both theatre parts first.'};"
          text = replace_once(text, old, new, 'four role editor availability')

          old = "var keys=roleAssignmentKeys(current),fiveMode=current.mode==='5',sevenMode=current.mode==='7',dirty=!!(draft&&roleAssignmentsDiffer(draft.assignments,baseline)),labels="
          new = "var keys=roleAssignmentKeys(current),fourMode=current.mode==='4',fiveMode=current.mode==='5',sevenMode=current.mode==='7',dirty=!!(draft&&roleAssignmentsDiffer(draft.assignments,baseline)),labels="
          text = replace_once(text, old, new, 'four role editor mode')
          text = replace_once(text, "names=(fiveMode||sevenMode)?working:", "names=(fourMode||fiveMode||sevenMode)?working:", 'four role names')
          text = replace_once(text, "return{guidance:fiveMode?'Arrange the five nurses working this night across four theatre roles and one full-night Labour Ward / Pager role. Each nurse is used once.'", "return{guidance:fourMode?'Arrange the four nurses working this night across the four theatre positions. Move the usual Pager nurse into the vacant theatre position, then set the shared Pager order separately. Each nurse is used once.':fiveMode?'Arrange the five nurses working this night across four theatre roles and one full-night Labour Ward / Pager role. Each nurse is used once.'", 'four role guidance')
          text = replace_once(text, "summary:stored?(fiveMode?'Custom five-nurse roles are active'", "summary:stored?(fourMode?'Four-nurse theatre reassignment is active':fiveMode?'Custom five-nurse roles are active'", 'four stored summary')
          text = replace_once(text, ":(fiveMode?'Optional custom five-nurse arrangement'", ":(fourMode?'Resolve the vacant theatre position':fiveMode?'Optional custom five-nurse arrangement'", 'four draft summary')

          marker = "  if(plan.count>=7){"
          insertion = "  var customFour=nightRoleOverrides[r.date]&&nightRoleOverrides[r.date].assignments;\n  if(customFour&&customFour.mode==='4'&&validRoleAssignmentsForNight(r,customFour)){FOUR_NIGHT_ROLE_KEYS.forEach(function(key){copy[key]=customFour[key]});copy.mode='5';copy.fullLW='Shared Pager · four nurses';copy.pager=copy.fullLW;copy.reliever='';copy.staffingAdjusted=true;copy.pendingAllocations=[];copy.additionalStaff=[];copy.sharedPagerFour=true;return copy}\n"
          if insertion.strip() not in text:
              if marker not in text: raise SystemExit('missing applyChanges insertion marker')
              text = text.replace(marker, insertion + marker, 1)

          text = text.replace("apply_night_role_override_v49", "apply_night_role_override_v57")
          clinical_path.write_text(text)

          shared_path = Path('src/shared-pager.ts')
          shared = shared_path.read_text()
          old = "  const roles: TheatreRoles = { first1: String(base.first1 || ''), first2: String(base.first2 || ''), second1: String(base.second1 || ''), second2: String(base.second2 || '') };\n  if (Object.values(roles).some(name => !name) || overtimeFor(date).length) return null;"
          new = "  const roles: TheatreRoles = { first1: String(base.first1 || ''), first2: String(base.first2 || ''), second1: String(base.second1 || ''), second2: String(base.second2 || '') };\n  const override = g.nightRoleOverrides?.[date]?.assignments;\n  if (override?.mode === '4') {\n    const saved: TheatreRoles = { first1: String(override.first1 || ''), first2: String(override.first2 || ''), second1: String(override.second1 || ''), second2: String(override.second2 || '') };\n    const working = typeof g.nightWorkingNames === 'function' ? g.nightWorkingNames(base).filter(Boolean).map(String) : Object.values(saved);\n    if (Object.values(saved).every(Boolean) && new Set(Object.values(saved).map(canonical)).size === 4 && sameSet(working, Object.values(saved))) return saved;\n  }\n  if (Object.values(roles).some(name => !name) || overtimeFor(date).length) return null;"
          shared = replace_once(shared, old, new, 'shared Pager saved four-role plan')
          shared_path.write_text(shared)

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          for key in ('test','verify:fast'):
              script = pkg['scripts'][key]
              if 'node tests/four-nurse-role.test.js' not in script:
                  script = script.replace('node tests/shared-pager.test.js', 'node tests/shared-pager.test.js && node tests/four-nurse-role.test.js')
              pkg['scripts'][key] = script
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          release = {
            'version': '56.2',
            'date': '24 October 2026',
            'title': 'Move the Pager nurse into a vacant theatre position',
            'summary': 'Makes four-nurse nights fully editable by letting the remaining Pager nurse fill the absent theatre nurse’s position before Pager is shared.',
            'changes': [
              'When one nurse is absent from the five-person establishment, Allocation now opens a four-nurse night-only role arrangement instead of leaving the theatre position unresolved.',
              'The usual full-night Pager nurse is suggested automatically in the vacant theatre position, while all four working nurses remain available so the team can confirm the exact theatre arrangement.',
              'The saved reassignment is shared, audited and used by Night, Full roster and the shared Pager display without changing the permanent rotation.',
              'After theatre positions are confirmed, the four working nurses still choose their shared Pager order separately.',
              'Clock-change timing remains based on real elapsed time, so tonight continues to use four two-hour Pager segments.'
            ],
            'update_policy': 'important'
          }
          Path('release.json').write_text(json.dumps(release, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Synchronise release and generated runtime
        run: npm run release
      - name: Commit prepared release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/legacy-ui/clinical.js src/shared-pager.ts package.json package-lock.json release.json app-core.js app-ui.js service-worker.js index.html manifest.webmanifest styles.css theme-bootstrap.js .project-state.json
          git commit -m "fix: support four-nurse theatre reassignment in 56.2 [four-role-prepared]"
          git push origin HEAD:fix/four-nurse-role-reassignment
