name: Verify 51.2 authorised dock repair
on:
  push:
    branches: [fix/51.2-chat-after-sign-in]
    paths-ignore: ['docs/reviews/**']
permissions:
  contents: write
jobs:
  browser-review:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:ci
      - name: Install review browsers
        timeout-minutes: 5
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium webkit
      - name: Exercise production sign-in and fallback navigation
        run: npx playwright test tests/ui-regressions.browser.spec.js
      - name: Save rendered dock evidence
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          fs.mkdirSync('docs/reviews/51.2',{recursive:true});
          for(const folder of fs.readdirSync('test-results')){
            const image=path.join('test-results',folder,'breaks-chat-visible.png');
            if(!fs.existsSync(image))continue;
            for(const project of ['mobile-chromium','mobile-webkit','desktop-chromium']){
              if(folder.endsWith(project))fs.copyFileSync(image,'docs/reviews/51.2/'+project+'-breaks-chat-visible.png');
            }
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reviews/51.2
          git commit -m "Capture 51.2 authorised dock browser evidence"
          git push origin HEAD:fix/51.2-chat-after-sign-in
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorised-dock-review
          path: test-results
          retention-days: 3
