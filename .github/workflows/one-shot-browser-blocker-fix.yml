name: One-shot browser blocker source repair

on:
  push:
    branches: [feat/night-intelligence-complete]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/night-intelligence-complete
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply source repair
        run: node scripts/one-shot-browser-blocker-fix.cjs
      - name: Verify repaired source
        run: |
          node --check night-intelligence.js
          npm run verify:night
          npm run verify:release
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add night-intelligence.js
          git commit -m "fix: repair Night Intelligence browser blockers" || exit 0
          git push origin HEAD:feat/night-intelligence-complete
