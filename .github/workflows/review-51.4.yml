name: Temporary 51.4 browser verification
on:
  push:
    branches: [review/51.4-read-launch]
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:ci
      - run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.config.js tests/ui-regressions.browser.spec.js --grep 'startup dock|short unread' --project=mobile-chromium --project=desktop-chromium --project=mobile-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-51.4-browser
          path: test-results
          retention-days: 3
