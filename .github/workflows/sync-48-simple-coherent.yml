name: One-shot 48.0 release sync

on:
  push:
    branches:
      - fix/48-simple-coherent
    paths:
      - release.json
      - src/product-unified.css
      - src/tailwind.css
      - tests/product-coherence.test.js
      - .github/workflows/sync-48-simple-coherent.yml

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/48-simple-coherent
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synchronise release
        run: npm run release
      - name: Verify simple coherent release
        run: npm run verify:fast
      - name: Commit synchronised release and remove one-shot workflow
        run: |
          rm .github/workflows/sync-48-simple-coherent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronise 48.0 release assets"
          git push origin HEAD:fix/48-simple-coherent
