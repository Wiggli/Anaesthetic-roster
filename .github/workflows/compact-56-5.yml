name: Compact 56.5 runtime

on:
  push:
    branches: [fix/56-5-four-nurse-allocation-clarity]

permissions:
  contents: write

jobs:
  compact:
    if: ${{ !contains(github.event.head_commit.message, '[56.5-compact]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/56-5-four-nurse-allocation-clarity
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compact role model and editor
        run: |
          python - <<'PY'
          from pathlib import Path

          clinical = Path('src/legacy-ui/clinical.js')
          text = clinical.read_text()
          old = "return{mode:String(current.mode||'6'),present:names.map(function(name){return{value:name,label:professionalName(name)}}),guidance:fourMode?'These are the four nurses present tonight. Keep the nurses already in their theatre positions and explicitly choose who fills any vacant theatre position. Nothing is assigned automatically. Set the shared Pager order only after the theatre arrangement is saved.'"
          new = "return{guidance:fourMode?'Four nurses are present. Choose who fills the vacant theatre position. Pager is set separately.'"
          if old not in text: raise SystemExit('role model compact anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace("stored?(fourMode?'Four-nurse theatre arrangement saved':", "stored?(fourMode?'Theatre arrangement saved':", 1)
          text = text.replace("(fourMode?'Choose who fills the vacant theatre position':", "(fourMode?'Choose the vacant theatre position':", 1)
          clinical.write_text(text)

          ui = Path('src/changes-experience.tsx')
          text = ui.read_text()
          text = text.replace("  mode?: string;\n  present?: { value: string; label: string }[];\n", "", 1)
          start = text.index('function RoleOverrideEditor')
          end = text.index('\n\nexport function renderChangesExperience', start)
          compact = '''function RoleOverrideEditor({model}:{model:RoleOverride}){if(model.notice)return <div className="time">{model.notice}</div>;const four=model.assignments.mode==='4';return <details className="nightRoleEditor" open={model.open}><summary><span><b>{four?'Arrange tonight’s 4 nurses':'Change this night’s roles'}</b><small>{model.summary}</small></span><span aria-hidden="true">›</span></summary><div className="nightRoleEditorBody">{four?<div className="fourNursePresent"><strong>Present tonight · {model.names.length}</strong><div className="fourNursePresentList">{model.names.map(name=><span key={name.value}>{name.label}</span>)}</div></div>:null}<p className="time">{model.guidance}</p><div className="editGrid">{model.keys.map(row=><label key={row.key} className={row.fullWidth?'fullWidth':''}>{row.label}<select data-night-role={row.key} value={model.assignments[row.key]||''} onChange={event=>dispatchAction({action:'role-select',key:row.key,value:event.target.value})}>{four&&!model.assignments[row.key]?<option value="" disabled>Select nurse</option>:null}{model.names.map(name=><option key={name.value} value={name.value}>{name.label}</option>)}</select></label>)}</div>{model.dirty&&<><div className="alert gold compactNotice">Unsaved night-only change</div><label>Reason for the change<input id="nightRoleReason" defaultValue={model.reason} maxLength={120} placeholder="For example, agreed role arrangement" onInput={event=>dispatchAction({action:'role-reason',value:event.currentTarget.value})}/></label><button type="button" id="saveNightRolesBtn" className="primary wide" disabled={!model.canSave} onClick={()=>dispatchAction({action:'role-save'})}>Save night-only change</button></>}{model.stored&&<button type="button" id="resetNightRolesBtn" className="soft wide" onClick={()=>dispatchAction({action:'role-reset'})}>Restore rostered roles</button>}</div></details>}'''
          text = text[:start] + compact + text[end:]
          ui.write_text(text)

          test = Path('tests/four-nurse-role.test.js')
          t = test.read_text().replace("/Present tonight · \\{model\\.present\\.length\\} nurses/", "/Present tonight · \\{model\\.names\\.length\\}/", 1)
          test.write_text(t)
          PY
      - name: Regenerate release artifacts
        run: npm run release
      - name: Verify full gate and performance budget
        run: npm run verify:ci
      - name: Commit compacted release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/legacy-ui/clinical.js src/changes-experience.tsx tests/four-nurse-role.test.js app-ui.js app-core.js service-worker.js index.html manifest.webmanifest styles.css theme-bootstrap.js .project-state.json src/legacy-ui/release-history.js src/legacy-ui/foundation.js package.json package-lock.json
          git commit -m "perf: keep 56.5 within existing runtime budget [56.5-compact]"
          git push origin HEAD:fix/56-5-four-nurse-allocation-clarity
