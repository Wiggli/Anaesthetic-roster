name: Patch 56.2 migration contract

on:
  push:
    branches: [fix/four-nurse-role-reassignment]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[migration-contract-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/four-nurse-role-reassignment
      - name: Update migration contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/roster.test.js')
          text = path.read_text()
          old = "assert.equal(checkedInMigrations.length, 32, 'all deployed and pending release Supabase migrations must remain checked in under supabase/migrations');\nassert.ok(checkedInMigrations.includes('20261024153714_shared_pager_four_nurse.sql'), 'the four-nurse shared Pager migration must stay checked in');"
          new = "assert.equal(checkedInMigrations.length, 33, 'all deployed and pending release Supabase migrations must remain checked in under supabase/migrations');\nassert.ok(checkedInMigrations.includes('20261024153714_shared_pager_four_nurse.sql'), 'the four-nurse shared Pager migration must stay checked in');\nassert.ok(checkedInMigrations.includes('20261024161000_four_nurse_role_override.sql'), 'the four-nurse theatre reassignment migration must stay checked in');"
          if old not in text:
              raise SystemExit('migration contract target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/roster.test.js
          git commit -m "test: include four-nurse role migration [migration-contract-patched]"
          git push origin HEAD:fix/four-nurse-role-reassignment
