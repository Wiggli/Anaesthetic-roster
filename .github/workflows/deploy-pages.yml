name: Test, migrate and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release metadata and run regression tests
        run: npm test
      - name: Build public app files
        run: npm run build
      - run: npm run verify:build
      - name: Install browser smoke runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop browser smoke tests
        run: npx playwright test --config=playwright.config.js
      - name: Preserve the exact tested Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  migrate:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: voaygfleqceqacvqixxp
    steps:
      - uses: actions/checkout@v5
      - name: Check secure deployment settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as GitHub Actions repository secrets."
            exit 1
          fi
      - uses: supabase/setup-cli@v3
        with:
          version: 2.45.5
      - name: Prepare database migrations
        shell: bash
        run: |
          supabase init
          shopt -s nullglob
          migration_files=(supabase/migrations/*.sql)
          if [ "${#migration_files[@]}" -eq 0 ]; then
            echo "::error::No checked-in Supabase migrations were found."
            exit 1
          fi
          root_migrations=(supabase-migration-*.sql)
          if [ "${#root_migrations[@]}" -ne 0 ]; then
            echo "::error::Legacy root migration files must be moved into supabase/migrations/."
            exit 1
          fi
      - name: Link the roster database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply new database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes
      - name: Deploy chat notification Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy notify-chat-message --project-ref "$SUPABASE_PROJECT_REF"
      - name: Chat notification endpoint health check
        shell: bash
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/notify-chat-message")"
          if [ "$status" != "401" ]; then
            echo "::error::Notification endpoint health check returned HTTP $status instead of the expected authenticated boundary."
            exit 1
          fi

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the already-tested Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live GitHub Pages site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          if [[ "$PAGE_URL" != https://* ]]; then
            echo "::error::The deployment did not return an HTTPS URL."
            exit 1
          fi
          page_url="${PAGE_URL%/}/"
          app_version="$(sed -n "s/^var APP_VERSION = '\([^']*\)';$/\1/p" dist/app-core.js)"
          if [ -z "$app_version" ]; then
            echo "::error::Could not determine APP_VERSION from the tested deployment artifact."
            exit 1
          fi
          index_file="$(mktemp)"
          service_worker_file="$(mktemp)"
          manifest_file="$(mktemp)"
          trap 'rm -f "$index_file" "$service_worker_file" "$manifest_file"' EXIT
          curl --fail --silent --show-error --location --proto '=https' \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${page_url}index.html" > "$index_file"
          if ! grep -Fq "app-core.js?v=${app_version}" "$index_file"; then
            echo "::error::The deployed page does not contain application version ${app_version}."
            exit 1
          fi
          curl --fail --silent --show-error --location --proto '=https' \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${page_url}app-core.js?v=${app_version}" > /dev/null
          curl --fail --silent --show-error --location --proto '=https' \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${page_url}app-ui.js?v=${app_version}" > /dev/null
          curl --fail --silent --show-error --location --proto '=https' \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${page_url}push.js?v=${app_version}" > /dev/null
          curl --fail --silent --show-error --location --proto '=https' \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${page_url}chat.js?v=${app_version}" > /dev/null
          curl --fail --silent --show-error --location --proto '=https' \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${page_url}chat.css?v=${app_version}" > /dev/null
          curl --fail --silent --show-error --location --proto '=https' \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${page_url}service-worker.js" > "$service_worker_file"
          cache_version="${app_version//./-}"
          if ! grep -Fq "anaesthetic-night-roster-v${cache_version}" "$service_worker_file"; then
            echo "::error::The deployed service worker does not match application version ${app_version}."
            exit 1
          fi
          curl --fail --silent --show-error --location --proto '=https' \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${page_url}manifest.webmanifest?v=${app_version}" > "$manifest_file"
          if ! grep -Fq "icon-192.png?v=${app_version}" "$manifest_file"; then
            echo "::error::The deployed manifest does not match application version ${app_version}."
            exit 1
          fi
