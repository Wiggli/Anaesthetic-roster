name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run deterministic release gate
        run: npm run verify:ci
      - name: Preserve the exact Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  migrate:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: voaygfleqceqacvqixxp
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect database or chat-function changes
        id: backend
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- supabase/migrations supabase/functions/notify-chat-message; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip unchanged backend deployment
        if: steps.backend.outputs.changed != 'true'
        run: echo "No database migration or chat notification function changed."
      - name: Check secure deployment settings
        if: steps.backend.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as GitHub Actions repository secrets."
            exit 1
          fi
      - uses: supabase/setup-cli@v3
        if: steps.backend.outputs.changed == 'true'
        with:
          version: 2.45.5
      - name: Prepare database migrations
        if: steps.backend.outputs.changed == 'true'
        shell: bash
        run: |
          supabase init
          shopt -s nullglob
          migration_files=(supabase/migrations/*.sql)
          if [ "${#migration_files[@]}" -eq 0 ]; then
            echo "::error::No checked-in Supabase migrations were found."
            exit 1
          fi
          root_migrations=(supabase-migration-*.sql)
          if [ "${#root_migrations[@]}" -ne 0 ]; then
            echo "::error::Legacy root migration files must be moved into supabase/migrations/."
            exit 1
          fi
      - name: Link the roster database
        if: steps.backend.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply new database migrations
        if: steps.backend.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes
      - name: Deploy chat notification Edge Function
        if: steps.backend.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy notify-chat-message --project-ref "$SUPABASE_PROJECT_REF"
      - name: Check chat notification boundary
        if: steps.backend.outputs.changed == 'true'
        shell: bash
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/notify-chat-message")"
          if [ "$status" != "401" ]; then
            echo "::error::Notification endpoint health check returned HTTP $status instead of the expected authenticated boundary."
            exit 1
          fi

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the tested Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the live PWA shell
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          if [[ "$PAGE_URL" != https://* ]]; then
            echo "::error::The deployment did not return an HTTPS URL."
            exit 1
          fi
          page_url="${PAGE_URL%/}/"
          app_version="$(sed -n "s/^var APP_VERSION = '\([^']*\)';$/\1/p" dist/app-core.js)"
          if [ -z "$app_version" ]; then
            echo "::error::Could not determine APP_VERSION from the tested deployment artifact."
            exit 1
          fi
          index_file="$(mktemp)"
          worker_file="$(mktemp)"
          manifest_file="$(mktemp)"
          trap 'rm -f "$index_file" "$worker_file" "$manifest_file"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "${page_url}index.html" > "$index_file"
          curl --fail --silent --show-error --location --proto '=https' --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "${page_url}service-worker.js" > "$worker_file"
          curl --fail --silent --show-error --location --proto '=https' --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "${page_url}manifest.webmanifest?v=${app_version}" > "$manifest_file"
          grep -Fq "app-core.js?v=${app_version}" "$index_file" || { echo "::error::Live index is not on ${app_version}."; exit 1; }
          cache_version="${app_version//./-}"
          grep -Fq "anaesthetic-night-roster-v${cache_version}" "$worker_file" || { echo "::error::Live service worker is not on ${app_version}."; exit 1; }
          grep -Fq "icon-192.png?v=${app_version}" "$manifest_file" || { echo "::error::Live manifest is not on ${app_version}."; exit 1; }
