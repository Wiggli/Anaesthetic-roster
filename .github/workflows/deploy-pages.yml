name: Test, migrate and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm test

  migrate:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: voaygfleqceqacvqixxp
    steps:
      - uses: actions/checkout@v5
      - name: Check secure deployment settings
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as GitHub Actions repository secrets."
            exit 1
          fi
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Prepare database migrations
        shell: bash
        run: |
          supabase init
          shopt -s nullglob
          migration_files=(supabase-migration-*.sql)
          for migration_file in "${migration_files[@]}"; do
            cp "$migration_file" "supabase/migrations/${migration_file#supabase-migration-}"
          done
      - name: Link the roster database
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply new database migrations
        run: supabase db push --linked --yes

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare public app files
        run: |
          mkdir dist
          cp index.html styles.css app-core.js app-ui.js service-worker.js manifest.webmanifest dist/
          cp anaesthesia-header.jpg mater-dei-logo.png apple-touch-icon.png icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png dist/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live GitHub Pages site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: >-
          curl --fail --silent --show-error --location
          --retry 5 --retry-delay 5 --retry-all-errors
          --connect-timeout 10 --max-time 30
          "$PAGE_URL" > /dev/null
