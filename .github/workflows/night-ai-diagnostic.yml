name: Night AI browser diagnostic

on:
  push:
    branches:
      - feat/night-ai-first-four

permissions:
  contents: read

jobs:
  night-ai-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build exact app
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run only Night AI browser tests
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/night-ai.browser.spec.js --config=playwright.config.js --reporter=line 2>&1 | tee night-ai-browser.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-ai-browser-diagnostic
          path: |
            night-ai-browser.log
            test-results
          if-no-files-found: ignore
