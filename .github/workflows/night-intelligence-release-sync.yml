name: Sync Night Intelligence release

on:
  push:
    branches: [feat/night-intelligence-complete]
    paths: [release.json]

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/night-intelligence-complete
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synchronise release metadata and generated compatibility assets
        run: npm run release
      - name: Verify synchronised release
        run: |
          npm run verify:release
          git diff --check
      - name: Commit release synchronisation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Release is already synchronised."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Night Intelligence 45.6 release"
          git push origin HEAD:feat/night-intelligence-complete
