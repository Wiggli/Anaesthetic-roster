name: Focused roster-management review
on:
  push:
    branches: [fix/roster-management-review]
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:fast
      - run: npm run verify:ci
      - run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium-webkit
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/establishment.browser.spec.js --project=mobile-chromium --project=desktop-chromium --project=mobile-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-roster-management-review
          path: |
            /tmp/establishment-*.png
            /tmp/roster-management-*.png
            test-results
          if-no-files-found: ignore
          retention-days: 5
