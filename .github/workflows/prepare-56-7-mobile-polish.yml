name: Prepare 56.7 mobile polish

on:
  push:
    branches: [fix/mobile-four-nurse-ui]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[56.7-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/mobile-four-nurse-ui
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare release metadata and regression checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          release={
            'version':'56.7',
            'date':'24 October 2026',
            'title':'Cleaner four-nurse changes screen',
            'summary':'Keeps the mobile navigation fixed and simplifies the exceptional four-nurse allocation screen so it reads clearly on iPhone.',
            'changes':[
              'Keeps the bottom navigation fixed in one place on mobile with no scroll-driven translation.',
              'Reflows the four-nurse theatre arrangement into a clean single-column mobile layout.',
              'Turns the present-nurse list into compact readable chips and gives every theatre selector full width.',
              'Reduces cramped side-by-side copy and improves spacing through the exceptional allocation flow.'
            ],
            'update_policy':'normal'
          }
          Path('release.json').write_text(json.dumps(release,indent=2)+"\n")

          p=Path('tests/product-interactions.test.js')
          s=p.read_text()
          marker="const account=fs.readFileSync('src/account-experience.tsx','utf8');"
          addition="const mobilePolish=fs.readFileSync('src/mobile-four-nurse-polish.css','utf8');assert.match(mobilePolish,/\\.bottom\\.dockScrollHidden[\\s\\S]*opacity: 1 !important/,'mobile dock cannot hide or translate during scroll');assert.match(mobilePolish,/\\.editGrid[\\s\\S]*grid-template-columns: 1fr !important/,'four-nurse mobile editor is single column');\n"
          if marker in s and 'four-nurse mobile editor is single column' not in s:
              p.write_text(s.replace(marker,addition+marker,1))
          PY
      - name: Build release and verify
        run: |
          npm run release
          npm run verify:ci
      - name: Commit prepared release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: simplify four-nurse mobile UI and pin dock [56.7-ready]"
          git push origin HEAD:fix/mobile-four-nurse-ui
