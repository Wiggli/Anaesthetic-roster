name: Harden Night Intelligence dialog

on:
  push:
    branches: [feat/night-intelligence-complete]
    paths: [dialog-fix.trigger]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/night-intelligence-complete
      - name: Make Health Check dialog self-healing
        shell: python
        run: |
          from pathlib import Path
          p = Path('night-intelligence.js')
          s = p.read_text()
          old = "function niOpenHealth(){\n  var host=niEl('nightHealthBody');if(!host)return;host.textContent='';var checks=niHealthChecks(),failed=checks.filter(function(check){return !check.ok});"
          new = "function niOpenHealth(){\n  var dialog=niDialog('nightHealthDialog','App health'),host=niEl('nightHealthBody');if(!host||!dialog.contains(host)){host=niMake('div','nightIntelligenceDialogBody');host.id='nightHealthBody';dialog.appendChild(host)}host.textContent='';var checks=niHealthChecks(),failed=checks.filter(function(check){return !check.ok});"
          if old not in s:
              raise SystemExit('Expected niOpenHealth opening not found')
          s = s.replace(old, new, 1)
          old_end = "host.appendChild(actions);niOpenDialog(niEl('nightHealthDialog'))\n}"
          new_end = "host.appendChild(actions);niOpenDialog(dialog)\n}"
          if old_end not in s:
              raise SystemExit('Expected niOpenHealth ending not found')
          s = s.replace(old_end, new_end, 1)
          p.write_text(s)
      - name: Verify syntax and focused contract
        run: |
          node --check night-intelligence.js
          node tests/night-intelligence.test.js
          git diff --check
      - name: Remove one-shot helper and commit
        shell: bash
        run: |
          rm -f dialog-fix.trigger .github/workflows/night-intelligence-dialog-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Night Intelligence health dialog"
          git push origin HEAD:feat/night-intelligence-complete
