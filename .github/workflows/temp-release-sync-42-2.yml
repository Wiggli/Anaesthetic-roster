name: Temporary 42.2 release sync

on:
  push:
    branches:
      - polish/night-colour-dock-42-2
    paths:
      - release.json
      - src/presentation.css
      - src/navigation.tsx
      - src/rudder-navigation.css
      - tests/source-architecture.test.js
      - .github/workflows/temp-release-sync-42-2.yml

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[release-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/night-colour-dock-42-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synchronize 42.2 release
        run: npm run release
      - name: Fast verification
        run: npm run verify:fast
      - name: Commit synchronized release artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release already synchronized"
            exit 0
          fi
          git commit -m "Synchronize release 42.2 [release-sync]"
          git push origin HEAD:polish/night-colour-dock-42-2
