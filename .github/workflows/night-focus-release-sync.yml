name: Night focus release sync

on:
  push:
    branches:
      - feat/night-intelligence-focus

permissions:
  contents: write

jobs:
  sync-release:
    if: github.event.head_commit.message != 'chore: sync release 45.7'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/night-intelligence-focus
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronise release references
        run: npm run release

      - name: Commit generated release files
        run: |
          if git diff --quiet; then
            echo "Release files already synchronised."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync release 45.7"
          git push origin HEAD:feat/night-intelligence-focus
