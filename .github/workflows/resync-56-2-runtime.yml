name: Resynchronise 56.2 runtime

on:
  push:
    branches: [fix/four-nurse-role-reassignment]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-resynced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/four-nurse-role-reassignment
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/legacy-ui/release-history.js src/legacy-ui/foundation.js src/legacy-ui/account.js src/legacy-ui/clinical.js src/legacy-ui/sync.js src/legacy-ui/bootstrap.js app-ui.js app-core.js service-worker.js index.html manifest.webmanifest styles.css theme-bootstrap.js package.json package-lock.json .project-state.json release.json
          git commit -m "chore: resynchronise 56.2 source and runtime [runtime-resynced]"
          git push origin HEAD:fix/four-nurse-role-reassignment
