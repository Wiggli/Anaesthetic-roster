name: One-time stabilization test patch

on:
  push:
    branches: [stabilize-release-pipeline]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stabilize-release-pipeline
      - name: Update stale workflow assertions
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/roster.test.js')
          source = path.read_text()

          old_build = "assert.match(workflow, /- name: Build public app files\\n        run: npm run build/, 'Pages must build the reviewed dist artifact');"
          new_build = "assert.match(workflow, /test:[\\s\\S]*run: npm run verify:ci[\\s\\S]*actions\\/upload-artifact@v4[\\s\\S]*name: pages-dist/, 'Pages must build and preserve the reviewed dist artifact through the deterministic release gate');"
          if old_build not in source:
              raise SystemExit('Old build assertion was not found')
          source = source.replace(old_build, new_build, 1)

          start_marker = "assert.match(workflow, /browser-smoke:"
          end_marker = "assert.match(workflow, /migrate:[\\s\\S]*needs: test/, 'production migration must wait for deterministic and browser verification in the required test job');"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Old browser workflow assertion block was not found')
          end += len(end_marker)
          new_browser = """const compatibilityWorkflow = fs.readFileSync(path.join(__dirname, '..', '.github', 'workflows', 'compatibility.yml'), 'utf8');
          assert.doesNotMatch(workflow, /browser-smoke:|browser-resilience:|schedule:/, 'routine deployment must not include expensive browser or scheduled compatibility lanes');
          assert.match(compatibilityWorkflow, /@playwright\\/test@1\\.55\\.0[\\s\\S]*verify:browser[\\s\\S]*verify:resilience/, 'the separate compatibility workflow must retain pinned browser smoke and resilience coverage');
          assert.match(compatibilityWorkflow, /schedule:[\\s\\S]*cron: '17 3 \\* \\* \\*'/, 'the separate compatibility workflow must retain the nightly browser run');
          assert.match(workflow, /migrate:[\\s\\S]*needs: test/, 'production migration must wait for the deterministic required test job');"""
          source = source[:start] + new_browser + source[end:]
          path.write_text(source)
      - name: Commit the assertion cleanup
        shell: bash
        run: |
          if git diff --quiet -- tests/roster.test.js; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/roster.test.js
          git commit -m "Tests: align roster CI assertions with simplified pipeline"
          git push origin HEAD:stabilize-release-pipeline
