name: Patch shared Pager migration name

on:
  push:
    branches: [feat/shared-pager-four-nurse]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[migration-name-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/shared-pager-four-nurse
      - name: Align migration filename assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/roster.test.js')
          text = path.read_text()
          old = '20261024173000_shared_pager_four_nurse.sql'
          new = '20261024153714_shared_pager_four_nurse.sql'
          if old not in text:
              raise SystemExit('old migration filename assertion not found')
          path.write_text(text.replace(old, new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/roster.test.js
          git commit -m "test: align shared Pager migration filename [migration-name-patched]"
          git push origin HEAD:feat/shared-pager-four-nurse
