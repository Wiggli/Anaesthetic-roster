name: Deploy Night Roster AI

on:
  workflow_run:
    workflows:
      - Test, migrate and deploy
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-night-ai:
    if: "${{ github.event.workflow_run.conclusion == 'success' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: voaygfleqceqacvqixxp
    steps:
      - name: Check out tested release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check secure deployment settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is required to deploy Night Roster AI."
            exit 1
          fi

      - uses: supabase/setup-cli@v3
        with:
          version: 2.45.5

      - name: Deploy authenticated Night Roster AI function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy night-roster-ai --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify authenticated boundary
        shell: bash
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/night-roster-ai")"
          if [ "$status" != "401" ]; then
            echo "::error::Night Roster AI endpoint returned HTTP $status instead of the expected authenticated boundary."
            exit 1
          fi
