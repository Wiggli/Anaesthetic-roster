name: Prepare 50.4 compact release history

on:
  push:
    branches:
      - fix/50-4-unified-date-update

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compact release-history source without changing runtime values
        run: node scripts/compact-release-history-50-4.mjs
      - name: Synchronise 50.4 artifacts
        run: node scripts/release.mjs
      - name: Run full 50.4 verification
        run: npm run verify:ci
      - name: Remove temporary preparation files and commit
        run: |
          rm -f scripts/compact-release-history-50-4.mjs .github/workflows/prepare-50-4-history-compact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "50.4 Compact release history without changing the archive"
          git push origin HEAD:fix/50-4-unified-date-update
