name: One-shot 50.0 ruthless UI simplification

on:
  push:
    branches:
      - fix/50-ruthless-simplification
    paths:
      - .github/workflows/sync-50-simplify-ui.yml

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/50-ruthless-simplification
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Simplify the active product system
        run: python3 scripts/one-shot-50.py
      - name: Synchronise 50.0 release boundary
        run: node scripts/release.mjs
      - name: Verify simplified product system
        run: npm run verify:fast
      - name: Commit simplification and remove one-shot helpers
        run: |
          git config user.name "Andre' Bartolo"
          git config user.email "35573717+Wiggli@users.noreply.github.com"
          git rm .github/workflows/sync-50-simplify-ui.yml scripts/one-shot-50.py
          git add -A
          git commit -m "50.0 Simplify the interface around the nurse"
          git push origin HEAD:fix/50-ruthless-simplification
