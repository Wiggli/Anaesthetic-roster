name: Prepare faster safe deployment pipeline

on:
  push:
    branches:
      - perf/faster-safe-deploys

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/faster-safe-deploys
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply deployment optimisation
        run: node scripts/prepare-ci-optimization.mjs
      - name: Update deployment safety contract
        run: node scripts/update-ci-contract.mjs
      - name: Verify application regression suite remains green
        run: npm test
      - name: Verify optimisation contracts
        shell: bash
        run: |
          grep -Fq "Decide whether the exact merged tree was already verified" .github/workflows/deploy-pages.yml
          grep -Fq "Run full resilience including iPhone WebKit" .github/workflows/deploy-pages.yml
          grep -Fq "Detect database or chat-function changes" .github/workflows/deploy-pages.yml
          grep -Fq "Detect Night Roster AI changes" .github/workflows/deploy-night-ai.yml
      - name: Commit verified workflow changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-ci-optimization.yml scripts/prepare-ci-optimization.mjs scripts/update-ci-contract.mjs
          git add .github/workflows/deploy-pages.yml .github/workflows/deploy-night-ai.yml tests/roster.test.js tests/development-workflow.test.js
          git commit -m "Speed up safe production deployments"
          git push origin HEAD:perf/faster-safe-deploys
