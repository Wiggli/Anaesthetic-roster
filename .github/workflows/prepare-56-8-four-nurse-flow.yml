name: Prepare 56.8 four-nurse flow

on:
  push:
    branches: [fix/four-nurse-flow]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[56.8-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/four-nurse-flow
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix four-nurse Changes flow and release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('src/changes-experience.tsx')
          s=p.read_text()
          old="""function AllocationList({ model }: { model: ChangesExperience }) {\n  useLayoutEffect(() => {\n    dispatchAction({ action: 'allocation-mounted' });\n  }, [model]);\n\n  if (!model.allocations.length) return <Surface className=\"tw:shadow-none\">\n"""
          new="""function AllocationList({ model }: { model: ChangesExperience }) {\n  useLayoutEffect(() => {\n    dispatchAction({ action: 'allocation-mounted' });\n  }, [model]);\n\n  if (model.roleOverride?.mode === '4' && !model.roleOverride.stored) return null;\n  if (!model.allocations.length) return <Surface className=\"tw:shadow-none\">\n"""
          if old not in s: raise SystemExit('AllocationList target not found')
          s=s.replace(old,new,1)

          old2="""function RoleOverrideEditor({ model }: { model: RoleOverride }) {\n  if (model.notice) return <div className=\"time\">{model.notice}</div>;\n\n  return <details className=\"nightRoleEditor\" open={model.open}>\n"""
          new2="""function RoleOverrideEditor({ model }: { model: RoleOverride }) {\n  const fourPending = model.mode === '4' && !model.stored;\n  useLayoutEffect(() => {\n    const summary = document.getElementById('allocationSummary');\n    if (summary) summary.hidden = fourPending;\n    return () => { if (summary) summary.hidden = false; };\n  }, [fourPending]);\n  if (model.notice) return <div className=\"time\">{model.notice}</div>;\n\n  return <details className=\"nightRoleEditor\" open={model.open}>\n"""
          if old2 not in s: raise SystemExit('RoleOverrideEditor target not found')
          p.write_text(s.replace(old2,new2,1))

          release={'version':'56.8','date':'24 October 2026','title':'Clear four-nurse allocation flow','summary':'Keeps the exceptional four-nurse Changes screen focused on the decision that actually remains.','changes':['Removes the no-allocation-needed panel while the four-nurse theatre arrangement is incomplete.','Keeps the theatre-position editor as the single active task until all four positions are saved.','Leaves Review changes blocked until that arrangement is complete, without contradictory messaging.','Keeps staffing, shared Pager, DST, audit and synchronisation logic unchanged.'],'update_policy':'normal'}
          Path('release.json').write_text(json.dumps(release,indent=2)+"\n")

          t=Path('tests/product-interactions.test.js')
          ts=t.read_text(); marker="const account=fs.readFileSync('src/account-experience.tsx','utf8');"
          add="const changesExperience=fs.readFileSync('src/changes-experience.tsx','utf8');assert.match(changesExperience,/roleOverride\\?\\.mode === '4'[\\s\\S]*return null/,'four-nurse pending state hides the generic allocation empty state');assert.match(changesExperience,/allocationSummary[\\s\\S]*hidden = fourPending/,'four-nurse pending state hides contradictory legacy allocation summary');\n"
          if marker in ts and 'four-nurse pending state hides the generic allocation empty state' not in ts: t.write_text(ts.replace(marker,add+marker,1))
          PY
      - name: Build release, trim obsolete retained note and verify
        run: |
          npm run release
          python - <<'PY'
          from pathlib import Path
          p=Path('src/legacy-ui/release-history.js')
          lines=p.read_text().splitlines()
          lines=[line for line in lines if not line.lstrip().startswith('["50.7"')]
          p.write_text('\n'.join(lines)+'\n')
          PY
          npm run generate:runtime
          npm run verify:ci
      - name: Commit prepared release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: remove contradictory four-nurse allocation state [56.8-ready]"
          git push origin HEAD:fix/four-nurse-flow
