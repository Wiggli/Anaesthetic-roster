name: Sync release artifacts

on:
  push:
    branches:
      - fix/mobile-cleanup-flow
    paths:
      - release.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/mobile-cleanup-flow
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Commit synchronized release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Synchronize 58.2 release artifacts"
          git push origin HEAD:fix/mobile-cleanup-flow
