name: Prepare 50.5 shared identity system

on:
  push:
    branches:
      - feat/50-5-shared-identity-system

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/50-5-shared-identity-system
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply shared identity design
        run: node scripts/prepare-50-5.mjs
      - name: Synchronise release artifacts
        run: npm run release
      - name: Verify product
        run: npm run verify:fast
      - name: Commit verified release
        shell: bash
        run: |
          rm -f scripts/prepare-50-5.mjs
          rm -f .github/workflows/prepare-50-5-shared-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "50.5 Apply shared branded identity across the app"
            git push origin HEAD:feat/50-5-shared-identity-system
          fi
