name: One-shot 49.0 product system consolidation

on:
  push:
    branches:
      - refactor/49-coherent-product-system
    paths:
      - .github/workflows/sync-49-product-system.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/49-coherent-product-system
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consolidate the active product design system
        run: python3 scripts/consolidate_49.py
      - name: Synchronise the 49.0 PWA release boundary
        run: npm run release
      - name: Verify the consolidated product system
        run: npm run verify:fast
      - name: Commit consolidation and remove one-shot helpers
        run: |
          git config user.name "Andre' Bartolo"
          git config user.email "35573717+Wiggli@users.noreply.github.com"
          git rm .github/workflows/sync-49-product-system.yml scripts/consolidate_49.py
          git add -A
          git commit -m "49.0 Consolidate one coherent product system"
          git push origin HEAD:refactor/49-coherent-product-system
