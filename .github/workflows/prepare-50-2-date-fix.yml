name: Prepare 50.2 date conflict release

on:
  push:
    branches:
      - fix/50-2-date-conflict

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synchronise 50.2 release
        run: node scripts/release.mjs
      - name: Verify product and release
        run: npm run verify:fast
      - name: Commit synchronised artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release already synchronised"
            exit 0
          fi
          git commit -m "50.2 Synchronize date conflict release"
          git push origin HEAD:fix/50-2-date-conflict
