name: Verify 51.1 repair
on:
  push:
    branches: ['fix/51.1-navigation-onboarding-welcome']
permissions:
  contents: write
jobs:
  repair-verification:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Synchronise release and generated compatibility files
        run: |
          npm run release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Synchronise 51.1 release and generated runtime"
            git push
          fi
      - run: npm run verify:ci
      - run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install native browser runtimes
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - name: Review repair on Chromium and iPhone WebKit
        run: npx playwright test tests/ui-regressions.browser.spec.js tests/product-coherence.browser.spec.js --project=mobile-chromium --project=mobile-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-browser-evidence
          path: |
            test-results
            playwright-report
          retention-days: 7
