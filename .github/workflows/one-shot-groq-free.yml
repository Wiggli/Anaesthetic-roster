name: One-shot Groq free-tier AI migration

on:
  push:
    branches:
      - fix/groq-free-ai
    paths:
      - .github/workflows/one-shot-groq-free.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/groq-free-ai
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Switch Night Roster AI to Groq free tier
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, value) { fs.writeFileSync(path, value); }
          function replaceRequired(source, from, to, label) {
            if (!source.includes(from)) throw new Error('Missing expected source for ' + label);
            return source.replace(from, to);
          }

          const edgePath = 'supabase/functions/night-roster-ai/index.ts';
          let edge = read(edgePath);
          edge = replaceRequired(edge,
            'const apiKey = Deno.env.get("OPENAI_API_KEY") || "";',
            'const apiKey = Deno.env.get("GROQ_API_KEY") || "";',
            'Groq API key environment');
          edge = replaceRequired(edge,
            'const model = Deno.env.get("OPENAI_NIGHT_ROSTER_MODEL") || "gpt-6-luna";',
            'const model = Deno.env.get("GROQ_NIGHT_ROSTER_MODEL") || "openai/gpt-oss-20b";',
            'Groq model environment');
          edge = replaceRequired(edge,
            'const response = await fetch("https://api.openai.com/v1/responses", {',
            'const response = await fetch("https://api.groq.com/openai/v1/responses", {',
            'Groq Responses endpoint');
          edge = replaceRequired(edge,
            'console.error("Night Roster AI model request failed", { status: response.status, mode });',
            'console.error("Night Roster AI provider request failed", { status: response.status, mode });',
            'provider failure log');
          edge = replaceRequired(edge,
            'console.error("Night Roster AI request error", { mode, name: error instanceof Error ? error.name : "error" });',
            'console.error("Night Roster AI provider error", { mode, name: error instanceof Error ? error.name : "error" });',
            'provider exception log');
          edge = replaceRequired(edge,
            '        max_output_tokens: mode === "ask" ? 360 : 260,',
            '        max_output_tokens: mode === "ask" ? 360 : 260,\n        reasoning: { effort: "low" },',
            'low-cost reasoning configuration');
          edge = replaceRequired(edge,
            '    return json(req, { answer: text(answer, 1800), ai: true, model });',
            '    return json(req, { answer: text(answer, 1800), ai: true, model, provider: "groq" });',
            'provider diagnostic');
          write(edgePath, edge);

          const testPath = 'tests/night-ai.test.js';
          let test = read(testPath);
          test = replaceRequired(test,
            "assert.doesNotMatch(client, /OPENAI_API_KEY/, 'The browser bundle must never contain an OpenAI secret');",
            "assert.doesNotMatch(client, /OPENAI_API_KEY/, 'The browser bundle must never contain an OpenAI secret');\nassert.doesNotMatch(client, /GROQ_API_KEY/, 'The browser bundle must never contain a Groq secret');\nassert.doesNotMatch(client, /api\\.groq\\.com/, 'The browser must never call Groq directly');",
            'browser secret checks');
          test = replaceRequired(test,
            "assert.match(edge, /OPENAI_API_KEY/, 'The model key must stay in the Edge Function environment');\nassert.match(edge, /https:\\\/\\\/api\\.openai\\.com\\/v1\\/responses/, 'The Edge Function must use the Responses API');",
            "assert.match(edge, /GROQ_API_KEY/, 'The Groq key must stay in the Edge Function environment');\nassert.match(edge, /GROQ_NIGHT_ROSTER_MODEL/, 'The Groq model override must stay server-side');\nassert.match(edge, /openai\\/gpt-oss-20b/, 'The free-tier default model must be GPT-OSS 20B');\nassert.match(edge, /https:\\\/\\\/api\\.groq\\.com\\/openai\\/v1\\/responses/, 'The Edge Function must use the Groq Responses API');\nassert.doesNotMatch(edge, /https:\\\/\\\/api\\.openai\\.com/, 'The Edge Function must not call the paid OpenAI API');\nassert.doesNotMatch(edge, /OPENAI_API_KEY/, 'The Edge Function must not depend on an OpenAI API key');",
            'server provider checks');
          test = replaceRequired(test,
            "assert.match(edge, /store:\\s*false/, 'Model requests must disable response storage');",
            "assert.match(edge, /store:\\s*false/, 'Model requests must disable response storage');\nassert.match(edge, /reasoning:\\s*\\{\\s*effort:\\s*\"low\"\\s*\\}/, 'Groq GPT-OSS should use low reasoning effort to conserve the free quota');",
            'free quota reasoning check');
          write(testPath, test);

          const release = {
            version: '46.0',
            date: '6 October 2026',
            title: 'Move Night Roster AI to the Groq free tier',
            summary: 'Night Roster AI now targets Groq\'s free-tier Responses API with GPT-OSS 20B, keeping the provider credential exclusively in the Supabase Edge Function and retaining the deterministic roster summary whenever the free AI service is unavailable or its quota is exhausted.',
            changes: [
              'Moves server-side Night Roster AI requests from the paid OpenAI API endpoint to Groq\'s OpenAI-compatible Responses API.',
              'Uses openai/gpt-oss-20b as the default model and low reasoning effort to keep requests within Groq free-tier limits while preserving concise roster-grounded answers.',
              'Keeps GROQ_API_KEY entirely inside the authenticated Supabase Edge Function so no provider credential is exposed to the browser or installed PWA.',
              'Preserves the deterministic roster engine as the authority and automatically falls back to the existing roster summary when Groq is unavailable, unconfigured, rate-limited or offline.',
              'Adds regression checks preventing accidental browser-side Groq calls or a return to a paid OpenAI API dependency.'
            ],
            update_policy: 'normal'
          };
          write('release.json', JSON.stringify(release, null, 2) + '\n');
          NODE

      - name: Synchronise release 46.0
        run: npm run release

      - name: Verify Groq migration
        run: npm run verify:fast

      - name: Remove one-shot workflow and commit release
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-groq-free.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Run Night Roster AI on Groq free tier'
          git push origin HEAD:fix/groq-free-ai
