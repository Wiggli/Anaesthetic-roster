name: One-shot quiet stale notification hotfix

on:
  push:
    branches:
      - fix/quiet-stale-notifications

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply quiet freshness policy
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const intelligencePath = 'night-intelligence.js';
          let intelligence = fs.readFileSync(intelligencePath, 'utf8');

          const staleAgeWarning = "  var age=niSyncAge();if(navigator.onLine!==false&&age!==null&&age>180000)items.push({id:'stale',severity:'warning',title:'Roster may be stale',detail:'The shared roster has not refreshed for '+Math.floor(age/60000)+' minutes.',action:'refresh'});\n";
          if (!intelligence.includes(staleAgeWarning)) throw new Error('Expected three-minute passive stale warning was not found.');
          intelligence = intelligence.replace(staleAgeWarning, '');

          const oldAttentionCount = "function niAttentionCount(){return niAttentionItems().filter(function(item){return item.severity==='critical'||item.severity==='warning'}).length}";
          const newAttentionCount = "function niActionableAttention(item){return !!item&&(item.severity==='critical'||item.severity==='warning')&&item.action!=='refresh'}\nfunction niAttentionCount(){return niAttentionItems().filter(niActionableAttention).length}";
          if (!intelligence.includes(oldAttentionCount)) throw new Error('Expected attention count contract was not found.');
          intelligence = intelligence.replace(oldAttentionCount, newAttentionCount);

          const oldNotify = "function niSmartNotify(items){\n  var critical=items.filter(function(item){return item.severity==='critical'||item.severity==='warning'}),signature=critical.map(function(item){return item.id}).sort().join('|');state.lastAttentionSignature=signature;if(!signature||signature===state.lastNotifiedSignature)return;";
          const newNotify = "function niSmartNotify(items){\n  var critical=items.filter(niActionableAttention),signature=critical.map(function(item){return item.id}).sort().join('|');state.lastAttentionSignature=signature;if(!signature||signature===state.lastNotifiedSignature)return;";
          if (!intelligence.includes(oldNotify)) throw new Error('Expected smart notification filter was not found.');
          intelligence = intelligence.replace(oldNotify, newNotify);

          fs.writeFileSync(intelligencePath, intelligence);

          const testPath = 'tests/night-intelligence.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          const anchor = "assert.doesNotMatch(intelligence, /\\.from\\s*\\(/, 'Night Intelligence must not create a second database write/read contract');\n";
          if (!test.includes(anchor)) throw new Error('Night Intelligence test anchor was not found.');
          const additions = anchor +
            "assert.doesNotMatch(intelligence, /age>180000/, 'elapsed minutes alone must not create a stale-roster warning');\n" +
            "assert.doesNotMatch(intelligence, /id:'stale'/, 'passive refresh age must not become an attention warning');\n" +
            "assert.match(intelligence, /function niActionableAttention/, 'Night Intelligence must distinguish actionable roster issues from technical refresh notices');\n" +
            "assert.match(intelligence, /item\\.action!==\'refresh\'/, 'technical refresh items must not drive push notifications or app-badge attention');\n" +
            "assert.match(intelligence, /items\\.filter\\(niActionableAttention\\)/, 'smart notifications must use the actionable-attention filter');\n";
          test = test.replace(anchor, additions);
          fs.writeFileSync(testPath, test);

          const release = {
            version: '45.9',
            date: '6 October 2026',
            title: 'Quiet passive roster freshness alerts',
            summary: 'Night Roster keeps sync age visible without treating a few quiet minutes as an incident, while push notifications stay focused on roster issues that genuinely need a nurse to act.',
            changes: [
              'Removes the three-minute age-only stale warning so an otherwise healthy online roster no longer raises a prominent Roster may be stale card simply because no full refresh happened for a few minutes.',
              'Keeps freshness visible in the compact Night status strip while reserving in-app sync warnings for real stale or error states reported by the shared-data runtime.',
              'Stops technical refresh and sync-health items from generating Night Intelligence push notifications or app-badge attention, while preserving meaningful staffing, allocation and conflict alerts.',
              'Adds regression coverage so passive refresh age cannot silently become an attention warning or noisy push path again.'
            ],
            update_policy: 'normal'
          };
          fs.writeFileSync('release.json', JSON.stringify(release, null, 2) + '\n');
          NODE
      - name: Synchronise release 45.9
        run: npm run release
      - name: Verify hotfix
        run: npm run verify:fast
      - name: Commit generated release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-quiet-stale.yml
          git add -A
          git commit -m "Quiet passive roster freshness alerts"
          git push origin HEAD:${GITHUB_REF_NAME}
