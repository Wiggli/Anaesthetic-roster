name: Prepare 50.4 runtime budget

on:
  push:
    branches:
      - fix/50-4-unified-date-update

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep recent release history in the runtime bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/legacy-ui/foundation.js')
          lines = path.read_text().splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if line.startswith('var RELEASE_HISTORY=['))
          cut = next(i for i, line in enumerate(lines[start + 1:], start + 1) if '"version":"43.5"' in line)
          end = next(i for i, line in enumerate(lines[cut:], cut) if line.strip() == '];')
          removed = end - cut
          assert removed > 0
          path.write_text(''.join(lines[:cut] + lines[end:]))
          print(f'Removed {removed} archived release-history records from the startup runtime; 44.0 and newer remain in-app.')
          PY
      - name: Synchronise 50.4 runtime artifacts
        run: node scripts/release.mjs
      - name: Run full 50.4 verification
        run: npm run verify:ci
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/prepare-50-4-budget.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "50.4 Keep the startup runtime within budget"
          git push origin HEAD:fix/50-4-unified-date-update
