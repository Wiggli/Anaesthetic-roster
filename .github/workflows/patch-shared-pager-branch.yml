name: Patch shared Pager branch

on:
  push:
    branches:
      - feat/shared-pager-four-nurse

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[shared-pager-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/shared-pager-four-nurse
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply small release-test updates
        run: |
          python - <<'PY'
          from pathlib import Path
          roster = Path('tests/roster.test.js')
          text = roster.read_text()
          old = "assert.equal(checkedInMigrations.length, 31, 'all deployed and pending release Supabase migrations must remain checked in under supabase/migrations');"
          new = "assert.equal(checkedInMigrations.length, 32, 'all deployed and pending release Supabase migrations must remain checked in under supabase/migrations');\nassert.ok(checkedInMigrations.includes('20261024173000_shared_pager_four_nurse.sql'), 'the four-nurse shared Pager migration must stay checked in');"
          if old not in text:
              raise SystemExit('migration count assertion not found')
          roster.write_text(text.replace(old, new, 1))

          package = Path('package.json')
          text = package.read_text()
          marker = 'node tests/roster.test.js &&'
          replacement = 'node tests/roster.test.js && node tests/shared-pager.test.js &&'
          if marker not in text:
              raise SystemExit('roster test script marker not found')
          text = text.replace(marker, replacement)
          package.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/roster.test.js package.json
          git commit -m "test: register shared Pager migration and contract [shared-pager-patched]"
          git push origin HEAD:feat/shared-pager-four-nurse
