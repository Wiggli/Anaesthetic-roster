name: One-time remaining CI assertion patch

on:
  push:
    branches: [stabilize-release-pipeline]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stabilize-release-pipeline
      - name: Update remaining stale CI assertions
        shell: python
        run: |
          from pathlib import Path

          chat = Path('tests/chat.test.js')
          source = chat.read_text()
          old = "assert.match(workflow, /build:[\\s\\S]*- name: Build public app files\\n        run: npm run build[\\s\\S]*actions\\/upload-artifact@v4[\\s\\S]*name: pages-dist/, 'verified chat and push assets must be built once and preserved for deployment');"
          new = "assert.match(workflow, /test:[\\s\\S]*run: npm run verify:ci[\\s\\S]*actions\\/upload-artifact@v4[\\s\\S]*name: pages-dist/, 'verified chat and push assets must pass the deterministic release gate and be preserved for deployment');"
          if old not in source:
              raise SystemExit('Expected stale chat workflow assertion was not found')
          chat.write_text(source.replace(old, new, 1))
      - name: Report any remaining retired workflow assumptions
        shell: bash
        run: |
          grep -R -n -E 'Build public app files|browser-smoke:|browser-resilience:|needs: \\[build|post-merge exact-tree|Test, migrate and deploy' tests || true
      - name: Commit the assertion cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/chat.test.js
          git commit -m "Tests: align chat CI assertion with simplified pipeline"
          git push origin HEAD:stabilize-release-pipeline
