name: Prepare 50.6 premium Night hero

on:
  push:
    branches:
      - feat/50-6-mockup-hero

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/50-6-mockup-hero
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply premium mock-up hero system
        run: python scripts/apply-50-6-mockup-hero.py
      - name: Synchronise release artifacts
        run: npm run release
      - name: Verify product
        run: npm run verify:fast
      - name: Remove preparation files
        run: rm -f .github/workflows/prepare-50-6-mockup-hero.yml scripts/apply-50-6-mockup-hero.py
      - name: Commit verified release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "50.6 Match Night hero to premium mock-up"
          git push origin HEAD:feat/50-6-mockup-hero
