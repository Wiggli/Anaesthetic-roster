name: Prepare 50.8 layout consolidation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prepare-50-8-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'fix/50-8-layout-consolidation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply 50.8 layout consolidation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text()

          def write(path, value):
              Path(path).write_text(value)

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          # Structural shell: Changes and Breaks use one compact shift-context row,
          # while the live staffing node keeps its original ID and update wiring.
          shell_path = 'src/coherent-shell.ts'
          shell = read(shell_path)
          helper = '''function consolidateTaskNightContext(screen: 'changes' | 'breaks') {
            const panel = document.querySelector<HTMLElement>(`#${screen} .nightContextPanel`);
            const identity = panel?.querySelector<HTMLElement>('.nightTeamIdentityContext');
            const staffing = panel?.querySelector<HTMLElement>('.nightContextStaffing');
            const meta = panel?.querySelector<HTMLElement>('.nightContextMetaRow');
            if (!panel || !identity || !staffing) return;

            let row = panel.querySelector<HTMLElement>(':scope > .appShiftContextRow');
            if (!row) {
              row = document.createElement('div');
              row.className = 'appShiftContextRow';
              identity.insertAdjacentElement('beforebegin', row);
              row.append(identity);
            }
            if (staffing.parentElement !== row) row.append(staffing);
            meta?.classList.add('hidden');
          }

          '''
          shell = replace_once(shell, 'function normaliseProductShell() {', helper + 'function normaliseProductShell() {', 'insert task-context helper')
          shell = replace_once(
              shell,
              "  addClass('.bottom.reactTabs', 'appDock');\n\n  const chatRosterContext",
              "  addClass('.bottom.reactTabs', 'appDock');\n\n  consolidateTaskNightContext('changes');\n  consolidateTaskNightContext('breaks');\n\n  const chatRosterContext",
              'activate compact task context'
          )
          shell = replace_once(shell, "document.documentElement.dataset.productShell = '50.7';", "document.documentElement.dataset.productShell = '50.8';", 'shell marker')
          write(shell_path, shell)

          # React owns the visible Changes stepper. The legacy rail and state remain as a
          # true fallback only if the optional React workflow fails to mount.
          workflow_path = 'src/changes-workflow.tsx'
          workflow = read(workflow_path)
          old_effect = '''  useLayoutEffect(() => {
            document.getElementById('changesWorkflowExperience')?.setAttribute('data-react-ready', 'true');
          }, []);'''
          new_effect = '''  useLayoutEffect(() => {
            const host = document.getElementById('changesWorkflowExperience');
            const fallback = document.querySelector<HTMLElement>('#changes .changesWorkflowTabs');
            const legacyState = document.getElementById('changesWorkflowState');
            host?.setAttribute('data-react-ready', 'true');
            fallback?.classList.add('hidden');
            fallback?.setAttribute('aria-hidden', 'true');
            legacyState?.classList.add('hidden');
            legacyState?.setAttribute('aria-hidden', 'true');
            return () => {
              fallback?.classList.remove('hidden');
              fallback?.removeAttribute('aria-hidden');
              legacyState?.classList.remove('hidden');
              legacyState?.removeAttribute('aria-hidden');
            };
          }, []);'''
          workflow = replace_once(workflow, old_effect, new_effect, 'Changes fallback ownership')
          write(workflow_path, workflow)

          css_path = 'src/product-unified.css'
          css = read(css_path)
          css = replace_once(css, '/* 50.7 coherent product system.\n   This file is the single final product-wide presentation authority. It deliberately\n   replaces the accumulated 50.1/50.4/50.5/50.6 override generations with one shared\n   shell, one spacing rhythm, one selected-night language and one navigation system. */', '/* 50.8 consolidated operational layout.\n   This remains the single final product-wide presentation authority. The 50.8 pass\n   removes duplicate workflow chrome, consolidates task-screen context and reduces\n   vertical repetition instead of adding another competing polish generation. */', 'CSS ownership header')
          css = replace_once(css, '  --unified-space-3: 14px;', '  --unified-space-3: 12px;', 'shared vertical rhythm')
          css = replace_once(css, '  padding: calc(var(--app-safe-top, 0px) + 2px) 11px 13px !important;', '  padding: calc(var(--app-safe-top, 0px) + 2px) 11px 9px !important;', 'Night hero padding')
          css = replace_once(css, '#today #appHeader { order: 1; }\n#today .nightDateShell { order: 2; }', '#today #appHeader { order: 1; }\n#today .hospitalStrip { min-height: 48px !important; }\n#today .nightDateShell { order: 2; }', 'Night institution height')
          css = replace_once(css, '''#today .nightTeamIdentityContext {
            position: relative !important;
            min-height: 94px !important;
            grid-template-columns: 70px minmax(0, 1fr) !important;
            gap: 12px !important;
            margin: 0 1px 9px !important;
            padding: 10px 40px 10px 10px !important;''', '''#today .nightTeamIdentityContext {
            position: relative !important;
            min-height: 86px !important;
            grid-template-columns: 64px minmax(0, 1fr) !important;
            gap: 10px !important;
            margin: 0 1px 7px !important;
            padding: 8px 38px 8px 8px !important;''', 'Night shift identity geometry')
          css = replace_once(css, '''#today .nightTeamIdentityContext .shiftIdentityMark {
            width: 70px !important;
            min-width: 70px !important;
            height: 70px !important;
            min-height: 70px !important;
            border-radius: 19px !important;''', '''#today .nightTeamIdentityContext .shiftIdentityMark {
            width: 64px !important;
            min-width: 64px !important;
            height: 64px !important;
            min-height: 64px !important;
            border-radius: 17px !important;''', 'Night shift mark geometry')
          css = replace_once(css, '#today .dateNav.rosterDateControl { margin-inline: 3px !important; width: calc(100% - 6px) !important; }', '#today .dateNav.rosterDateControl { min-height: 40px !important; margin-inline: 3px !important; width: calc(100% - 6px) !important; }', 'Night date rail height')
          css = replace_once(css, '''#today .nightSectionIdentity {
            margin: 0 !important;
            padding: 15px 6px 3px !important;
          }''', '''#today .nightSectionIdentity {
            margin: 0 !important;
            padding: 10px 6px 1px !important;
          }''', 'Night greeting spacing')
          css = replace_once(css, '  font-size: clamp(30px, 8.5vw, 38px) !important;', '  font-size: clamp(28px, 7.8vw, 34px) !important;', 'Night greeting scale')

          task_context_anchor = '''#changes .nightContextMetaRow,
          #breaks .nightContextMetaRow {'''
          task_context_rules = '''#changes .changesDatePanel,
          #breaks .breaksContextPanel {
            margin-bottom: 10px !important;
            padding: 0 !important;
            border: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
          }
          #changes .appShiftContextRow,
          #breaks .appShiftContextRow {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) auto !important;
            gap: 8px !important;
            align-items: center !important;
            margin: 0 0 8px !important;
          }
          #changes .appShiftContextRow .nightTeamIdentityContext,
          #breaks .appShiftContextRow .nightTeamIdentityContext {
            width: 100% !important;
            margin: 0 !important;
          }
          #changes .appShiftContextRow .nightContextStaffing,
          #breaks .appShiftContextRow .nightContextStaffing {
            min-height: 30px !important;
            padding: 4px 9px !important;
            background: var(--unified-accent-soft) !important;
          }
          ''' + task_context_anchor
          css = replace_once(css, task_context_anchor, task_context_rules, 'task context row rules')

          css = replace_once(css, '  margin: 2px 0 12px !important;', '  margin: 0 0 8px !important;', 'Changes heading spacing')
          css = replace_once(css, '''#changes .workflowSteps,
          #changes .changesWorkflowTabs {
            display: grid !important;
            grid-template-columns: repeat(3, minmax(0,1fr)) !important;
            gap: 3px !important;
            margin: 0 0 12px !important;''', '''#changes .workflowSteps,
          #changes .changesWorkflowTabs {
            display: grid !important;
            grid-template-columns: repeat(3, minmax(0,1fr)) !important;
            gap: 3px !important;
            margin: 0 0 8px !important;''', 'Changes workflow spacing')
          css = replace_once(css, '  min-height: 52px !important;\n  padding: 6px 4px !important;', '  min-height: 46px !important;\n  padding: 5px 4px !important;', 'Changes workflow height')
          css = replace_once(css, '''#changes .changesWorkflowState,
          #changes .workflowGuidance {
            margin: 0 0 12px !important;
            padding: 10px 12px !important;''', '''#changes .changesWorkflowState,
          #changes .workflowGuidance {
            margin: 0 0 8px !important;
            padding: 7px 9px !important;''', 'Changes guidance density')
          css = replace_once(css, '  padding: 15px !important;\n  border: 1px solid var(--unified-border) !important;\n  border-radius: 0 !important;', '  padding: 13px !important;\n  border: 1px solid var(--unified-border) !important;\n  border-radius: 0 !important;', 'Changes staffing density')

          css = replace_once(css, '''#breaks .personalBreakSummary {
            margin: 0 0 12px !important;
            padding: 15px !important;''', '''#breaks .personalBreakSummary {
            margin: 0 0 10px !important;
            padding: 14px !important;''', 'Break summary density')
          css = replace_once(css, '  margin: 0 0 13px !important;\n  padding: 0 !important;', '  margin: 0 0 10px !important;\n  padding: 0 !important;', 'Break statistics spacing')
          css = replace_once(css, '''#breaks .breakPlanTitle {
            margin: 0 2px 8px !important;
            align-items: center !important;
          }''', '''#breaks .breakPlanTitle {
            margin: 0 2px 6px !important;
            align-items: center !important;
          }
          #breaks .breakPlanTools {
            display: flex !important;
            justify-content: flex-end !important;
            margin: 0 2px 7px !important;
          }
          #breaks .jumpToMeButton,
          #today .nightContextLine button {
            min-height: 32px !important;
            padding: 4px 10px !important;
            border: 1px solid var(--unified-border) !important;
            border-radius: 999px !important;
            background: var(--unified-soft) !important;
            color: var(--liquid-accent-strong) !important;
            box-shadow: none !important;
            font-size: 10.5px !important;
            font-weight: 700 !important;
          }''', 'secondary action language')

          css = replace_once(css, '''  #today .nightTeamIdentityContext {
            min-height: 84px !important;
            grid-template-columns: 62px minmax(0,1fr) !important;
            gap: 10px !important;
            padding: 9px 36px 9px 9px !important;
          }''', '''  #today .nightTeamIdentityContext {
            min-height: 76px !important;
            grid-template-columns: 56px minmax(0,1fr) !important;
            gap: 9px !important;
            padding: 7px 34px 7px 7px !important;
          }''', 'small-phone Night identity')
          css = replace_once(css, '''  #today .nightTeamIdentityContext .shiftIdentityMark {
            width: 62px !important;
            min-width: 62px !important;
            height: 62px !important;
            min-height: 62px !important;
            border-radius: 17px !important;
          }''', '''  #today .nightTeamIdentityContext .shiftIdentityMark {
            width: 56px !important;
            min-width: 56px !important;
            height: 56px !important;
            min-height: 56px !important;
            border-radius: 16px !important;
          }''', 'small-phone Night mark')
          css = replace_once(css, '  #today .nightUnifiedHero .nightSectionIdentity h1 { font-size: clamp(28px, 8.3vw, 34px) !important; }', '  #today .nightUnifiedHero .nightSectionIdentity h1 { font-size: clamp(27px, 7.8vw, 31px) !important; }', 'small-phone Night greeting')
          write(css_path, css)

          # Regression protection for the concrete screenshot issues fixed here.
          test_path = 'tests/product-layout-contract.test.js'
          test = read(test_path)
          test = replace_once(test, "const coherentShell = fs.readFileSync('src/coherent-shell.ts', 'utf8');", "const coherentShell = fs.readFileSync('src/coherent-shell.ts', 'utf8');\nconst changesWorkflow = fs.readFileSync('src/changes-workflow.tsx', 'utf8');", 'layout test workflow source')
          test = replace_once(test, "document.documentElement.dataset.productShell = '50.7'", "document.documentElement.dataset.productShell = '50.8'", 'layout test shell version')
          test = replace_once(test, "'50.7 product shell marker must identify the coherent-shell refactor'", "'50.8 product shell marker must identify the layout-consolidation pass'", 'layout test shell message')
          insert_after = "assert.ok(coherentShell.includes(\"'appShiftIdentity'\"), 'operational screens must share one shift-identity contract');"
          additions = "\nassert.ok(coherentShell.includes('appShiftContextRow'), 'Changes and Breaks must consolidate staffing beside shift identity instead of leaving a floating badge');\nassert.ok(changesWorkflow.includes(\"fallback?.classList.add('hidden')\"), 'React Changes workflow must hide the duplicate legacy stepper only after it mounts');\nassert.ok(changesWorkflow.includes(\"legacyState?.classList.add('hidden')\"), 'React Changes guidance must suppress the duplicate legacy workflow state');\nassert.ok(css.includes('#changes .appShiftContextRow'), 'task screens must share the compact shift-context row');"
          test = replace_once(test, insert_after, insert_after + additions, 'layout consolidation assertions')
          test = replace_once(test, "console.log('50.7 date, update and unified-shell regression checks passed');", "console.log('50.8 layout-consolidation, date and update regression checks passed');", 'layout test completion label')
          write(test_path, test)

          release = {
            'version': '50.8',
            'date': '7 October 2026',
            'title': 'Consolidate the operational layout',
            'summary': 'Removes the duplicate Changes workflow rail, attaches staffing to the shared shift context, reduces top-screen vertical repetition and tightens Night while preserving its branded identity.',
            'changes': [
              'Removes the duplicate Staffing, Allocation and Confirm rail once the React workflow has mounted, while retaining the legacy rail as a true fallback if the optional workflow chunk ever fails.',
              'Consolidates the Changes and Breaks staffing count beside the shared shift identity instead of leaving a floating badge, so both task screens use the same compact shift and date composition.',
              'Flattens the Changes selected-night container, reduces workflow and guidance height, and brings Absences and Overtime materially higher on the screen without changing staffing behaviour.',
              'Tightens the Night institution row, shift card, date rail and personalised greeting so the hero keeps its premium identity with less vertical volume before the allocation card.',
              'Tightens Breaks summary spacing and standardises Jump to me and other secondary controls on the same compact pill language.',
              'Preserves roster calculations, staffing rules, allocation semantics, First and Second Part timing, Malta and DST handling, authentication, database writes, offline safety and clinical state colours.'
            ],
            'update_policy': 'normal'
          }
          write('release.json', json.dumps(release, indent=2) + '\n')
          PY
      - name: Synchronise release artifacts
        run: node scripts/release.mjs
      - name: Run fast product gate
        run: npm run verify:fast
      - name: Run full deterministic gate
        run: npm run verify:ci
      - name: Commit synchronised 50.8 artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "50.8 artifacts are already synchronised."
          else
            git commit -m "50.8 Consolidate the operational layout"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
