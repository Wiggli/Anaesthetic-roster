name: Prepare 56.3 manual shared Pager order

on:
  push:
    branches: [fix/shared-pager-manual-order]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[manual-pager-prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/shared-pager-manual-order
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove inferred Pager order and add explicit selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('src/shared-pager.ts')
          text = path.read_text()

          old = "  const host = ensureHost(pane, 'sharedPagerEditor', true), stored = orderCache.get(state.date), current = drafts.get(state.date) || stored?.nurse_order || state.nurses, timing = timingFor(state.date), each = timing ? Number(timing.totalHours) / 4 : 0;"
          new = "  const host = ensureHost(pane, 'sharedPagerEditor', true), stored = orderCache.get(state.date), savedOrder = Array.isArray(stored?.nurse_order) && stored.nurse_order.length === 4 ? stored.nurse_order : null, current = drafts.get(state.date) || savedOrder || ['', '', '', ''], timing = timingFor(state.date), each = timing ? Number(timing.totalHours) / 4 : 0, slotSegments = segments(state.date, ['', '', '', '']), complete = current.length === 4 && current.every(Boolean) && new Set(current.map(canonical)).size === 4 && sameSet(current, state.nurses);"
          if old not in text:
              raise SystemExit('shared Pager editor state target not found')
          text = text.replace(old, new, 1)

          old = "${current.map((name, index) => `<label><span>Part ${index + 1}</span><select data-shared-pager-index=\"${index}\" aria-label=\"Shared Pager part ${index + 1}\">${state.nurses.map(option => `<option value=\"${escapeHtml(option)}\" ${sameNurse(option, name) ? 'selected' : ''}>${escapeHtml(professional(option))}</option>`).join('')}</select><small>${escapeHtml(segments(state.date, current)[index]?.label || '')}</small></label>`).join('')}"
          new = "${current.map((name, index) => `<label><span>Part ${index + 1}</span><select data-shared-pager-index=\"${index}\" aria-label=\"Shared Pager part ${index + 1}\"><option value=\"\" disabled ${name ? '' : 'selected'}>Select nurse</option>${state.nurses.map(option => { const usedElsewhere = current.some((chosen, chosenIndex) => chosenIndex !== index && chosen && sameNurse(chosen, option)); return `<option value=\"${escapeHtml(option)}\" ${sameNurse(option, name) ? 'selected' : ''} ${usedElsewhere ? 'disabled' : ''}>${escapeHtml(professional(option))}</option>`; }).join('')}</select><small>${escapeHtml(slotSegments[index]?.label || '')}</small></label>`).join('')}"
          if old not in text:
              raise SystemExit('shared Pager options target not found')
          text = text.replace(old, new, 1)

          old = "<div class=\"sharedPagerEditorStatus\" role=\"status\">${stored ? `Saved by ${escapeHtml(stored.updated_by || 'the team')}${stored.updated_at ? ` · ${escapeHtml(new Date(stored.updated_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}` : ''}` : 'Not saved yet. Record the order agreed by the four nurses.'}</div><div class=\"sharedPagerActions\"><button type=\"button\" class=\"primary\" data-shared-pager-save>Save shared Pager order</button>"
          new = "<div class=\"sharedPagerEditorStatus\" role=\"status\">${stored ? `Saved by ${escapeHtml(stored.updated_by || 'the team')}${stored.updated_at ? ` · ${escapeHtml(new Date(stored.updated_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}` : ''}` : 'Not saved yet. Select one nurse for each Pager part in the order agreed by the four nurses.'}</div><div class=\"sharedPagerActions\"><button type=\"button\" class=\"primary\" data-shared-pager-save ${complete ? '' : 'disabled'}>Save shared Pager order</button>"
          if old not in text:
              raise SystemExit('shared Pager status target not found')
          text = text.replace(old, new, 1)

          old = "{ toast('Use each of the four working nurses once'); return; }"
          new = "{ toast('Select all four working nurses, using each nurse once'); return; }"
          if old not in text:
              raise SystemExit('shared Pager validation copy target not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/shared-pager.test.js')
          t = test.read_text()
          anchor = "assert.match(source, /Email plan/, 'shared effective plan must support email');"
          addition = "\nassert.match(source, /Select nurse/, 'unsaved shared Pager parts must show an explicit Select nurse placeholder');\nassert.doesNotMatch(source, /stored\\?\\.nurse_order \\|\\| state\\.nurses/, 'theatre order must never prefill a new shared Pager order');\nassert.match(source, /current = drafts\\.get\\(state\\.date\\) \\|\\| savedOrder \\|\\| \\[\\'', '\\'', '\\'', '\\'\\]/, 'a new shared Pager order must start with four unselected slots');"
          if anchor not in t:
              raise SystemExit('shared Pager test anchor not found')
          if 'unsaved shared Pager parts must show' not in t:
              t = t.replace(anchor, anchor + addition, 1)
          test.write_text(t)

          release = {
            'version': '56.3',
            'date': '24 October 2026',
            'title': 'Manual four-person Pager order',
            'summary': 'Keeps the four-person Pager order completely manual instead of preselecting names from theatre parts.',
            'changes': [
              'A new four-person Shared Pager order now starts with four explicit Select nurse fields rather than prefilled names.',
              'The app no longer assumes that Pager order should follow First Part or Second Part theatre order.',
              'Each working nurse can be selected only once, and Save remains unavailable until all four Pager parts are assigned.',
              'Existing saved Pager orders remain visible and editable, so previously agreed plans are not lost.',
              'The theatre reassignment and shared Pager timing introduced in 56.2 remain unchanged.'
            ],
            'update_policy': 'important'
          }
          Path('release.json').write_text(json.dumps(release, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Synchronise release and generated runtime
        run: npm run release
      - name: Verify focused Pager behaviour
        run: node tests/shared-pager.test.js
      - name: Commit prepared release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/shared-pager.ts tests/shared-pager.test.js release.json package.json package-lock.json app-ui.js app-core.js service-worker.js index.html manifest.webmanifest styles.css theme-bootstrap.js .project-state.json src/legacy-ui/release-history.js src/legacy-ui/foundation.js
          git commit -m "fix: require manual shared Pager order in 56.3 [manual-pager-prepared]"
          git push origin HEAD:fix/shared-pager-manual-order
